services:
  mysql:
    image: mysql:8.4
    container_name: auth-lab-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: auth_lab
      MYSQL_USER: ${DB_USERNAME:?required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?required}
      TZ: Asia/Seoul

    ports:
      - "127.0.0.1:3307:3306"

    volumes:
      - auth-lab-mysql-data:/var/lib/mysql

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  auth-lab-mysql-data:
